[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webforge"
version = "0.1.0"
description = "An autonomous computer-use agent: plans, runs parallel browser sub-agents, asks before consequential actions and verifies its result."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Auro-rium" }]
requires-python = ">=3.11"
dependencies = [
    "backboard-sdk>=1.5.19",
    "playwright>=1.45",
    "rich>=13",
    "python-dotenv>=1.0",
    "Pillow>=10",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]


[project.urls]
Homepage = "https://github.com/Auro-rium/web-forge"
Repository = "https://github.com/Auro-rium/web-forge"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff"]

[tool.setuptools.packages.find]
include = ["webforge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: needs a real Backboard key and network (skipped otherwise)"]

[tool.ruff]
line-length = 120
