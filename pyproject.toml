[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webforge"
version = "0.1.0"
description = "A self-improving web-browsing deep agent: it turns successful browser traces into replayable skills."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Auro-rium" }]
requires-python = ">=3.11"
dependencies = [
    "backboard-sdk>=1.5.19",
    "playwright>=1.45",
    "rich>=13",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]


[project.urls]
Homepage = "https://github.com/Auro-rium/webforge"
Repository = "https://github.com/Auro-rium/webforge"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff"]

[tool.setuptools.packages.find]
include = ["webforge*", "bench*"]

# Mirrors pytest.ini (which pytest reads first; keep the two in sync).
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
