<!doctype html><html><head><meta charset="utf-8"><title>Log in - Fixture Hub</title></head>
<body><main><h1>Member login</h1>
<form id="login"><label for="user">Username</label><input id="user" name="user">
<label for="pw">Password</label><input id="pw" name="pw" type="password">
<button type="submit">Log in</button></form>
<p id="msg" role="alert"></p>
<script>
document.getElementById('login').addEventListener('submit', e => {
  e.preventDefault();
  const ok = e.target.user.value === 'ada' && e.target.pw.value === 'hunter2-secret';
  document.getElementById('msg').textContent = ok ? 'Welcome back, ada.' : 'Invalid username or password.';
});
</script></main></body></html>
